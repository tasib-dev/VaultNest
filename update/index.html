<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Storage Update</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    max-width:400px;
}

h1{
    margin-top:0;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:14px 28px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
}

.button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="card">

<h1>Cloud Storage</h1>

<h3>Latest Version</h3>

<p id="version">Loading...</p>

<a class="button" id="downloadButton" href="#">
Download APK
</a>
    
</div>

<script>
fetch("version.json")
.then(r => r.json())
.then(data => {
    document.getElementById("version").innerHTML =
        data.version + " (Build " + data.build + ")";

    document.getElementById("downloadButton").href = data.apk;
});
</script>

</body>

</html>
